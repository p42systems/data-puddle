version: '3.8'

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd123###"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - ./backups:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/1433 || exit 1'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  data-loader:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sql-server:
        condition: service_healthy
    command: >
      bash -c "
      echo '=== VALIDATING TOOLS ===';
      ls -l /opt/mssql-tools/bin/sqlcmd;
      echo '=== WAITING FOR SQL SERVER ===';
      timeout 90 bash -c 'until /opt/mssql-tools/bin/sqlcmd -S sql-server -U sa -P \"$$SA_PASSWORD\" -Q \"SELECT 1\" &> /dev/null; do sleep 2; done';
      echo '=== RESTORING DATABASE ===';
      /opt/mssql-tools/bin/sqlcmd -S sql-server -U sa -P \"$$SA_PASSWORD\" -Q \"
      RESTORE DATABASE AdventureWorks2019
      FROM DISK = N'/var/opt/mssql/backup/AdventureWorks2019.bak'
      WITH
        MOVE 'AdventureWorks2019' TO '/var/opt/mssql/data/AdventureWorks2019.mdf',
        MOVE 'AdventureWorks2019_log' TO '/var/opt/mssql/data/AdventureWorks2019.ldf',
        REPLACE,
        STATS = 5;\"
      echo '=== RESTORE COMPLETE ===';
      "
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd123###"
    volumes:
      - ./backups:/var/opt/mssql/backup